name: int4_pack_awq
group: quant_pack
description: |
  Pack codes AND zeros into the AWQ layout: qweight (K, N/8), qzeros (K/g, N/8), both packing
  along N with the AWQ_ORDER [0,2,4,6,1,3,5,7] interleave; no zero offset.
inputs: q int64 (K,N); zeros int64 (K/g,N)
outputs: qweight int32 (K,N/8); qzeros int32 (K/g,N/8)
constraints: "K % 8 == 0, N % 8 == 0, K % g == 0"
format_ref: formats/int4_w4a16_packing.md
verification:
  mode: bit_exact
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: none
  torch_compile: false
  expert: null
adversarial_classes: [boundary_nibbles, zero_offset_wrap, halfway_rounding, saturation, outliers, zero_rows]
