name: gemv_fp8_e4m3
group: dequant_gemv
description: |
  FP8 GEMV: weights stored as e4m3fn bit patterns (K, N) uint8 with one per-tensor fp32
  scale; decode, dequant, y_n = sum_k w_kn x_k. Bug axes: interpreting e4m3fn bytes as e5m2
  (or as int8), forgetting that e4m3fn saturates at 448 on cast, per-tensor scale applied
  per-channel, fp16 decode of the byte patterns.
inputs: w_bits uint8 (K,N); w_scale fp32 (1,); x fp32 (K,)
outputs: y fp32 (N,)
constraints: "K % 8 == 0, N % 8 == 0"
format_ref: formats/fp8_e4m3_e5m2.md
verification:
  mode: derived_tolerance
  tolerance: {kind: sum_abs, coef: 0.05, atol: 1.0e-6, int_shift: 0}
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: decode + torch.matmul
  torch_compile: true
  expert: _scaled_mm
adversarial_classes: [saturation, halfway_rounding, outliers]
