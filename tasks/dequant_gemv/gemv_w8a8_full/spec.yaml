name: gemv_w8a8_full
group: dequant_gemv
description: |
  Fully quantized INT8 GEMV path: activations per-token int8 (M, K) and weights
  per-channel int8 (K, N), both with fp32 scales. The int32 accumulation x_q @ w_q is exactly
  defined; only the dequantizing multiplies are approximate. Bug axes: swapping which operand
  gets per-token vs per-channel scales, fp32 accumulation of the int8 product (rounding the
  exact int32 accumulator), dividing the scales instead of multiplying.
inputs: x_q int8 (M,K); x_scales fp32 (M,); w_q int8 (K,N); w_scales fp32 (N,)
outputs: y fp32 (M,N)
constraints: "K % 8 == 0, N % 8 == 0, K * 127 * 127 < 2^31"
format_ref: formats/rounding_and_scale_conventions.md
verification:
  mode: derived_tolerance
  tolerance: {kind: sum_abs, coef: 0.51, atol: 1.0e-6, int_shift: 0}
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: _int_mm + scale dequant
  torch_compile: true
  expert: humming
adversarial_classes: [saturation, outliers, zero_rows]
