name: gemm_fp8_e4m3_e5m2_mixed
group: gemm
description: |
  Mixed-format FP8 GEMM: activations in e4m3fn (M, K), weights in e5m2 (K, N), each with a
  per-tensor fp32 scale. e5m2 preserves inf while e4m3fn saturates at 448 — the two decodes
  must not be confused. Bug axes: swapping the formats between operands, decoding both with
  the same dtype, applying one scale to both operands.
inputs: a_bits uint8 (M,K); a_scale fp32 (1,); b_bits uint8 (K,N); b_scale fp32 (1,)
outputs: y fp32 (M,N)
constraints: "K % 8 == 0, N % 8 == 0"
format_ref: formats/fp8_e4m3_e5m2.md
verification:
  mode: derived_tolerance
  tolerance: {kind: sum_abs, coef: 0.21, atol: 1.0e-6, int_shift: 0}
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: decode + torch.matmul
  torch_compile: true
  expert: _scaled_mm
adversarial_classes: [saturation, halfway_rounding, outliers]
