name: gemm_w4a16_awq
group: gemm
description: |
  W4A16 GEMM against AWQ-packed weights: qweight (K, N/8) and qzeros (K/g, N/8) both pack
  along N with the AWQ nibble permutation; dequant, then y = x @ W. Bug axes: applying the
  GPTQ layout (qweight packed along K, low nibble first, zeros offset-wrapped) instead of
  AWQ, missing the interleaved column order, wrong scale broadcast along K.
inputs: qweight int32 (K,N/8); qzeros int32 (K/g,N/8); scales fp32 (K/g,N); x fp32 (M,K)
outputs: y fp32 (M,N)
constraints: "K % 8 == 0, N % 8 == 0, K % g == 0"
format_ref: formats/int4_w4a16_packing.md
verification:
  mode: derived_tolerance
  tolerance: {kind: sum_abs, coef: 0.51, atol: 1.0e-6, int_shift: 0}
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: dequant + torch.matmul
  torch_compile: true
  expert: marlin
adversarial_classes: [boundary_nibbles, zero_offset_wrap, outliers]
