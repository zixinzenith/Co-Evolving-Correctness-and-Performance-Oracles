name: gemm_fp8_e4m3_rowwise
group: gemm
description: |
  Rowwise-scaled FP8 GEMM (the torch._scaled_mm contract): activations e4m3fn bytes (M, K)
  with per-row scales (M,), weights e4m3fn bytes (K, N) with per-column scales (N,);
  y_mn = a_mn_scale * b_n_scale * sum_k e4m3(a_mk) e4m3(b_kn). Bug axes: row vs column scale
  swap, treating scales as per-tensor, missing the fp32 upcast of the e4m3 bytes before the
  product, forgetting the 448 saturation of the original cast.
inputs: a_bits uint8 (M,K); a_scales fp32 (M,); b_bits uint8 (K,N); b_scales fp32 (N,)
outputs: y fp32 (M,N)
constraints: "K % 8 == 0, N % 8 == 0"
format_ref: formats/fp8_e4m3_e5m2.md
verification:
  mode: derived_tolerance
  tolerance: {kind: sum_abs, coef: 0.05, atol: 1.0e-6, int_shift: 0}
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: decode + torch.matmul
  torch_compile: true
  expert: _scaled_mm
adversarial_classes: [saturation, halfway_rounding, outliers, zero_rows]
