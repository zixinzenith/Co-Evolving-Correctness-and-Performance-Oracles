name: gemm_w8a8_int32
group: gemm
description: |
  Pure INT8 GEMM: exact int32 accumulation of per-token int8 activations (M, K) against
  per-channel int8 weights (K, N). No scales, no rounding — the contract is the integer
  accumulator itself, so verification is bit-exact. Bug axes: int8 arithmetic with silent
  overflow, fp32 accumulation then rounding back to int (loses the low bits), transposing
  one operand.
inputs: x_q int8 (M,K); w_q int8 (K,N)
outputs: acc int32 (M,N)
constraints: "K % 8 == 0, N % 8 == 0, K * 127 * 127 < 2^31"
format_ref: formats/rounding_and_scale_conventions.md
verification:
  mode: bit_exact
shapes:
  visible: [{'K': 64, 'N': 16, 'g': 32, 'M': 4}, {'K': 128, 'N': 32, 'g': 64, 'M': 8}]
  hidden: [{'K': 256, 'N': 64, 'g': 128, 'M': 16}, {'K': 512, 'N': 128, 'g': 64, 'M': 1}, {'K': 1024, 'N': 256, 'g': 128, 'M': 32}, {'K': 96, 'N': 24, 'g': 48, 'M': 2}, {'K': 4096, 'N': 512, 'g': 128, 'M': 64}]
baseline:
  pytorch: torch._int_mm
  torch_compile: true
  expert: humming
adversarial_classes: [saturation, outliers, zero_rows]
