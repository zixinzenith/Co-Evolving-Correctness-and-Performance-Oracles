name: kv_quant_fp8_e4m3_per_token
group: kv_cache
description: |
  FP8 KV cache, per-token scaling: scale_m = amax(|k_row|)/448, then k/s cast to e4m3fn
  bytes. The amax element maps exactly onto the 448 saturation boundary, and an all-zero
  token takes the scale=1 fallback. Bug axes: e5m2 decode of the bytes, dropping the
  fallback, dividing by 240/452-style constants, casting before scaling.
inputs: k fp32 (B,H,S,D)
outputs: bits uint8 (B,H,S,D); scales fp32 (B,H,S,)
constraints: "D % 8 == 0"
format_ref: formats/fp8_e4m3_e5m2.md
verification:
  mode: bit_exact
shapes:
  visible: [{'B': 2, 'H': 4, 'S': 16, 'D': 32, 'g': 8}, {'B': 1, 'H': 8, 'S': 32, 'D': 64, 'g': 16}]
  hidden: [{'B': 2, 'H': 8, 'S': 64, 'D': 128, 'g': 32}, {'B': 4, 'H': 2, 'S': 24, 'D': 48, 'g': 16}, {'B': 1, 'H': 16, 'S': 128, 'D': 256, 'g': 64}, {'B': 3, 'H': 4, 'S': 40, 'D': 96, 'g': 24}]
baseline:
  pytorch: scale + cast to float8_e4m3fn
  torch_compile: true
  expert: null
adversarial_classes: [saturation, halfway_rounding, zero_rows]
