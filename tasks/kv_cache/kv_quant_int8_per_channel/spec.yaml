name: kv_quant_int8_per_channel
group: kv_cache
description: |
  KV-cache quantization, per-channel INT8 (KIVI channel-wise layout): quantize along the
  token axis S, one scale per (batch, head, channel). A channel that is zero across all
  cached tokens forces the scale=1 fallback. Bug axes: quantizing along D (per-token
  layout) instead of S, applying the scales on the wrong axis at attention time.
inputs: k fp32 (B,H,S,D)
outputs: q int8 (B,H,S,D); scales fp32 (B,H,D,)
constraints: "D % 8 == 0"
format_ref: formats/rounding_and_scale_conventions.md
verification:
  mode: bit_exact
shapes:
  visible: [{'B': 2, 'H': 4, 'S': 16, 'D': 32, 'g': 8}, {'B': 1, 'H': 8, 'S': 32, 'D': 64, 'g': 16}]
  hidden: [{'B': 2, 'H': 8, 'S': 64, 'D': 128, 'g': 32}, {'B': 4, 'H': 2, 'S': 24, 'D': 48, 'g': 16}, {'B': 1, 'H': 16, 'S': 128, 'D': 256, 'g': 64}, {'B': 3, 'H': 4, 'S': 40, 'D': 96, 'g': 24}]
baseline:
  pytorch: quant + dequant reference
  torch_compile: true
  expert: null
adversarial_classes: [saturation, halfway_rounding, zero_rows]
