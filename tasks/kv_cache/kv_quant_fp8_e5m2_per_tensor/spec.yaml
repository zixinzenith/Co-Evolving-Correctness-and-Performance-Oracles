name: kv_quant_fp8_e5m2_per_tensor
group: kv_cache
description: |
  FP8 KV cache with one per-tensor e5m2 scale given as input: bits = e5m2(k / scale).
  Unlike e4m3fn, e5m2 preserves inf: values whose k/scale exceeds 57344 decode to inf, not
  to the max finite. Bug axes: clamping to the max finite value (e4m3fn habit), decoding
  with e4m3fn, scaling after the cast, ignoring that 60000 rounds down to 57344 but 1e6
  becomes inf.
inputs: k fp32 (B,H,S,D); scale fp32 (1,)
outputs: bits uint8 (B,H,S,D)
constraints: "D % 8 == 0"
format_ref: formats/fp8_e4m3_e5m2.md
verification:
  mode: bit_exact
shapes:
  visible: [{'B': 2, 'H': 4, 'S': 16, 'D': 32, 'g': 8}, {'B': 1, 'H': 8, 'S': 32, 'D': 64, 'g': 16}]
  hidden: [{'B': 2, 'H': 8, 'S': 64, 'D': 128, 'g': 32}, {'B': 4, 'H': 2, 'S': 24, 'D': 48, 'g': 16}, {'B': 1, 'H': 16, 'S': 128, 'D': 256, 'g': 64}, {'B': 3, 'H': 4, 'S': 40, 'D': 96, 'g': 24}]
baseline:
  pytorch: cast to float8_e5m2
  torch_compile: true
  expert: null
adversarial_classes: [saturation, halfway_rounding, zero_rows]
