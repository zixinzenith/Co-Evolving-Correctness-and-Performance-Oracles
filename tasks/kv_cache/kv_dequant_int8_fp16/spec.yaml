name: kv_dequant_int8_fp16
group: kv_cache
description: |
  Dequantize an INT8 KV cache back to half precision: out = fp16(q) * fp16(scale) computed
  in fp16 storage arithmetic, returned upcast to fp32. The fp16 multiply is exactly defined
  (round-to-nearest-even on the fp32-exact product), so verification is bit-exact. Bug
  axes: computing the product in fp32 and rounding only once at the end (different low
  bits), applying scales per-token when the cache stores per-channel scales.
inputs: q int8 (B,H,S,D); scales fp16 (B,H,S,)
outputs: out fp32 (B,H,S,D)
constraints: "D % 8 == 0"
format_ref: formats/rounding_and_scale_conventions.md
verification:
  mode: bit_exact
shapes:
  visible: [{'B': 2, 'H': 4, 'S': 16, 'D': 32, 'g': 8}, {'B': 1, 'H': 8, 'S': 32, 'D': 64, 'g': 16}]
  hidden: [{'B': 2, 'H': 8, 'S': 64, 'D': 128, 'g': 32}, {'B': 4, 'H': 2, 'S': 24, 'D': 48, 'g': 16}, {'B': 1, 'H': 16, 'S': 128, 'D': 256, 'g': 64}, {'B': 3, 'H': 4, 'S': 40, 'D': 96, 'g': 24}]
baseline:
  pytorch: cast + elementwise multiply
  torch_compile: true
  expert: null
adversarial_classes: [halfway_rounding, saturation, zero_rows]
